<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilih Kelas — Medalis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;margin:0;padding:0}
  body{font-family:'Poppins',sans-serif;background:#F7F5EE;color:#334155;-webkit-font-smoothing:antialiased}
  .ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;user-select:none}
  .grade-btn{min-height:96px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .grade-btn:hover{border-color:#D4A747;box-shadow:0 4px 0 0 #D4A747;transform:translateY(-2px)}
  .grade-btn:active{transform:translateY(0);box-shadow:none}
  .grade-btn.sel{border-color:#0B1E3A;background:#0B1E3A;color:#fff;box-shadow:0 4px 0 0 #D4A747}
  .grade-btn.sel .num{color:#D4A747}
  .grade-btn.sel .sub{color:#CBD5E1}
  .num{font-weight:800;font-size:26px;line-height:1;color:#0B1E3A}
  .sub{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#64748B;margin-top:6px}
  @media(min-width:768px){.grade-btn{min-height:112px} .num{font-size:32px}}
</style>
</head>
<body class="antialiased overflow-x-hidden">

<!-- NAVBAR TIPE B (Portal Siswa) -->
<header class="fixed top-0 left-0 w-full z-50 bg-white border-b border-[#E2E8F0]">
  <div class="max-w-7xl mx-auto h-[64px] px-4 md:px-6 flex items-center justify-between gap-3">
    <a href="landing-terang.html" class="flex items-center gap-2 no-underline shrink-0">
      <span class="ms text-[28px] text-[#D4A747]">school</span>
      <div class="flex flex-col leading-none">
        <span class="font-bold text-[17px] tracking-wide text-[#0B1E3A]">MEDALIS</span>
        <span class="text-[9px] tracking-widest uppercase font-semibold text-[#D4A747] mt-0.5">Akademi Olimpiade</span>
      </div>
    </a>
    <div class="flex items-center gap-2">
      <span class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#F7F5EE] border border-[#E2E8F0]">
        <span class="w-7 h-7 rounded-full bg-[#0B1E3A] text-[#D4A747] flex items-center justify-center text-[11px] font-bold">AP</span>
        <span class="text-[13px] font-semibold text-[#0B1E3A]">Aisyah</span>
      </span>
      <a href="landing-terang.html" class="w-10 h-10 flex items-center justify-center rounded-lg border border-[#E2E8F0] text-[#64748B] no-underline hover:bg-[#F7F5EE]" aria-label="Tutup">
        <span class="ms text-[20px]">close</span>
      </a>
    </div>
  </div>
</header>

<main class="pt-[64px] pb-28 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 md:px-6">

    <!-- Header -->
    <div class="pt-8 md:pt-10 mb-6">
      <div class="flex items-center gap-2 mb-3">
        <span class="w-6 h-6 rounded-full bg-[#D4A747] text-[#0B1E3A] flex items-center justify-center text-[12px] font-bold">1</span>
        <div class="flex-1 h-1.5 bg-[#E2E8F0] rounded-full overflow-hidden">
          <div class="h-full w-1/3 bg-[#D4A747] rounded-full"></div>
        </div>
        <span class="text-[11px] font-semibold text-[#64748B] shrink-0">1 / 3</span>
      </div>
      <h1 class="text-[26px] md:text-[32px] font-extrabold text-[#0B1E3A] leading-tight m-0">Anak Bunda sekarang kelas berapa?</h1>
      <p class="text-[14px] md:text-[15px] text-[#334155] mt-2 mb-0 leading-relaxed">Pilih jenjang dulu, lalu pilih kelasnya. Materi dan soal akan otomatis disesuaikan.</p>
    </div>

    <!-- Pilih Jenjang -->
    <div class="mb-6">
      <p class="text-[11px] font-bold uppercase tracking-widest text-[#7a5900] mb-3">1. Pilih Jenjang</p>
      <div class="grid grid-cols-4 gap-2 md:gap-3" role="tablist" aria-label="Pilih jenjang">
        <button type="button" class="tab h-[72px] md:h-[80px] rounded-xl border-2 border-[#E2E8F0] bg-white flex flex-col items-center justify-center gap-1 cursor-pointer" data-level="tk" role="tab" aria-selected="false">
          <span class="ms text-[26px] text-[#7a5900]">child_care</span>
          <span class="text-[13px] font-bold text-[#0B1E3A]">TK</span>
        </button>
        <button type="button" class="tab h-[72px] md:h-[80px] rounded-xl border-2 border-[#E2E8F0] bg-white flex flex-col items-center justify-center gap-1 cursor-pointer" data-level="sd" role="tab" aria-selected="false">
          <span class="ms text-[26px] text-[#7a5900]">menu_book</span>
          <span class="text-[13px] font-bold text-[#0B1E3A]">SD</span>
        </button>
        <button type="button" class="tab h-[72px] md:h-[80px] rounded-xl border-2 border-[#E2E8F0] bg-white flex flex-col items-center justify-center gap-1 cursor-pointer" data-level="smp" role="tab" aria-selected="false">
          <span class="ms text-[26px] text-[#7a5900]">science</span>
          <span class="text-[13px] font-bold text-[#0B1E3A]">SMP</span>
        </button>
        <button type="button" class="tab h-[72px] md:h-[80px] rounded-xl border-2 border-[#E2E8F0] bg-white flex flex-col items-center justify-center gap-1 cursor-pointer" data-level="sma" role="tab" aria-selected="false">
          <span class="ms text-[26px] text-[#7a5900]">school</span>
          <span class="text-[13px] font-bold text-[#0B1E3A]">SMA</span>
        </button>
      </div>
    </div>

    <!-- Pilih Kelas -->
    <div class="mb-6">
      <p class="text-[11px] font-bold uppercase tracking-widest text-[#7a5900] mb-3">2. Pilih Kelas</p>
      <div id="grades" class="grid grid-cols-3 md:grid-cols-4 gap-2 md:gap-3" role="group" aria-label="Pilih kelas">
        <!-- diisi JavaScript -->
      </div>
    </div>

    <!-- Info mapel -->
    <div id="info" class="hidden bg-white border-2 border-[#D4A747] rounded-xl p-4 md:p-5 mb-6">
      <div class="flex items-start gap-3">
        <span class="ms text-[22px] text-[#D4A747] shrink-0">check_circle</span>
        <div>
          <p class="text-[13px] font-bold text-[#0B1E3A] m-0" id="info-title">Materi siap</p>
          <p class="text-[13px] text-[#334155] m-0 mt-1 leading-relaxed" id="info-text">—</p>
        </div>
      </div>
    </div>

    <!-- Lewati -->
    <div class="text-center">
      <a href="dashboard-terang.html" class="inline-flex items-center gap-2 text-[13px] font-semibold text-[#64748B] no-underline hover:text-[#0B1E3A] py-2">
        Lewati dulu, pilih kelas nanti
        <span class="ms text-[16px]">arrow_forward</span>
      </a>
    </div>

  </div>
</main>

<!-- TOMBOL SIMPAN (sticky) -->
<div class="fixed bottom-0 left-0 w-full bg-white border-t border-[#E2E8F0] p-3 md:p-4 z-40">
  <div class="max-w-3xl mx-auto">
    <button id="saveBtn" type="button" disabled
      class="w-full h-[52px] md:h-[56px] rounded-xl bg-[#E2E8F0] text-[#94A3B8] font-bold text-[15px] cursor-not-allowed transition-colors flex items-center justify-center gap-2">
      <span class="ms text-[20px]">lock</span>
      <span id="saveLabel">Pilih kelas dulu</span>
    </button>
  </div>
</div>

<script>
const DATA = {
  tk:  {label:'TK', grades:[{n:'A',s:'Usia 4–5'},{n:'B',s:'Usia 5–6'}],
        mapel:'Kartu bergambar, angka, dan bentuk. Soal dibacakan lewat suara.'},
  sd:  {label:'SD', grades:[1,2,3,4,5,6].map(k=>({n:k,s:'Kelas '+k})),
        mapel:'Matematika dan IPA.'},
  smp: {label:'SMP', grades:[7,8,9].map(k=>({n:k,s:'Kelas '+k})),
        mapel:'Matematika, IPA, dan IPS.'},
  sma: {label:'SMA', grades:[10,11,12].map(k=>({n:k,s:'Kelas '+k})),
        mapel:'Matematika, Fisika, Kimia, dan Biologi.'}
};

let curLevel = null;
let curGrade = null;

const tabsEl  = document.querySelectorAll('.tab');
const gradesEl= document.getElementById('grades');
const infoEl  = document.getElementById('info');
const saveBtn = document.getElementById('saveBtn');
const saveLbl = document.getElementById('saveLabel');

function paintTabs(){
  tabsEl.forEach(t=>{
    const on = t.dataset.level === curLevel;
    t.setAttribute('aria-selected', on ? 'true':'false');
    t.style.borderColor = on ? '#0B1E3A' : '#E2E8F0';
    t.style.background  = on ? '#0B1E3A' : '#ffffff';
    t.querySelector('span.text-\\[13px\\]').style.color = on ? '#ffffff' : '#0B1E3A';
    t.querySelector('.ms').style.color = on ? '#D4A747' : '#7a5900';
  });
}

function paintGrades(){
  if(!curLevel){ gradesEl.innerHTML=''; return; }
  const list = DATA[curLevel].grades;
  gradesEl.innerHTML = list.map(g=>`
    <button type="button" class="grade-btn rounded-xl border-2 border-[#E2E8F0] bg-white flex flex-col items-center justify-center cursor-pointer ${curGrade===g.n?'sel':''}" data-grade="${g.n}">
      <span class="num">${g.n}</span>
      <span class="sub">${g.s}</span>
    </button>`).join('');
  gradesEl.querySelectorAll('.grade-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      curGrade = b.dataset.grade;
      applySelected();
      paintSave();
    });
  });
}

function applySelected(){
  gradesEl.querySelectorAll('.grade-btn').forEach(b=>{
    const on = b.dataset.grade === curGrade;
    b.classList.toggle('sel', on);
    b.setAttribute('aria-pressed', on ? 'true':'false');
  });
}

function paintSave(){
  const ready = curLevel && curGrade !== null;
  if(ready){
    const d = DATA[curLevel];
    const nama = curLevel==='tk' ? 'TK '+curGrade : 'Kelas '+curGrade+' '+d.label;
    infoEl.classList.remove('hidden');
    document.getElementById('info-title').textContent = nama+' dipilih';
    document.getElementById('info-text').textContent = 'Mapel: '+d.mapel;
    saveBtn.disabled=false;
    saveBtn.style.background='#D4A747';
    saveBtn.style.color='#0B1E3A';
    saveBtn.style.cursor='pointer';
    saveBtn.querySelector('.ms').textContent='check';
    saveLbl.textContent='Simpan & Lanjut ke Langkah 2';
  } else {
    infoEl.classList.add('hidden');
    saveBtn.disabled=true;
    saveBtn.style.background='#E2E8F0';
    saveBtn.style.color='#94A3B8';
    saveBtn.style.cursor='not-allowed';
    saveBtn.querySelector('.ms').textContent='lock';
    saveLbl.textContent='Pilih kelas dulu';
  }
}

tabsEl.forEach(t=>{
  t.addEventListener('click', ()=>{
    curLevel = t.dataset.level;
    curGrade = null;
    paintTabs(); paintGrades(); paintSave();
  });
});

saveBtn.addEventListener('click', ()=>{
  if(saveBtn.disabled) return;
  try{
    localStorage.setItem('medalis_level', curLevel);
    localStorage.setItem('medalis_grade', curGrade);
  }catch(e){}
  // Lanjut ke Langkah 2 (Nomor WhatsApp Bunda) via onboarding - k sudah dicatat
  window.location.href = 'onboarding-terang.html#lanjut';
});
</script>
</body>
</html>
