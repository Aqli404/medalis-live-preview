<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Ilustrasi podium juara olimpiade">
  <rect width="420" height="420" fill="none"/>

  <!-- Lingkaran latar -->
  <circle cx="210" cy="200" r="150" fill="#EFEEE6"/>
  <circle cx="210" cy="200" r="150" fill="none" stroke="#D4A747" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Podium -->
  <rect x="150" y="270" width="56" height="90" rx="6" fill="#1E3A5F"/>
  <rect x="210" y="240" width="56" height="120" rx="6" fill="#0B1E3A"/>
  <rect x="270" y="290" width="56" height="70" rx="6" fill="#1E3A5F"/>
  <text x="178" y="320" font-family="monospace" font-size="20" font-weight="700" fill="#94A3B8" text-anchor="middle">2</text>
  <text x="238" y="296" font-family="monospace" font-size="24" font-weight="700" fill="#D4A747" text-anchor="middle">1</text>
  <text x="298" y="332" font-family="monospace" font-size="20" font-weight="700" fill="#94A3B8" text-anchor="middle">3</text>

  <!-- Medali di atas podium juara -->
  <line x1="238" y1="240" x2="238" y2="196" stroke="#D4A747" stroke-width="3"/>
  <circle cx="238" cy="176" r="26" fill="#D4A747"/>
  <circle cx="238" cy="176" r="16" fill="none" stroke="#0B1E3A" stroke-width="3"/>
  <path d="M232 176 l4 4 l8 -9" stroke="#0B1E3A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bintang -->
  <path d="M210 110 l7 15 l16 2 l-12 12 l3 16 l-14 -8 l-14 8 l3 -16 l-12 -12 l16 -2 z" fill="#D4A747" opacity="0.9"/>
  <path d="M312 132 l5 11 l12 1.5 l-9 8.5 l2 12 l-10 -6 l-10 6 l2 -12 l-9 -8.5 l12 -1.5 z" fill="#D4A747" opacity="0.5"/>
  <path d="M128 150 l4 9 l10 1.5 l-7 7 l2 10 l-9 -5 l-8 5 l2 -10 l-7 -7 l10 -1.5 z" fill="#D4A747" opacity="0.4"/>

  <!-- Sorot lampu dari atas -->
  <path d="M170 40 l40 240 h-56 z" fill="#D4A747" opacity="0.10"/>
  <path d="M250 40 l40 240 h-56 z" fill="#D4A747" opacity="0.10"/>
</svg>
